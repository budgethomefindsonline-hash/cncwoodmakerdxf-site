<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="description" content="Free laser cut bottle gift box generator for wine and whisky bottles. Export DXF, SVG and AI files for plywood. By CNCWoodMakerDXF.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CNCWoodMakerDXF — Bottle Gift Box Generator</title>
<style>:root{--bg:#f4efe7;--panel:#fffdf9;--ink:#2b2118;--mut:#7b6a58;--line:#e4d8c6;--acc:#9a4d1f;--acc2:#c8793b;--ok:#2f7d4a;--warn:#b7791f;--err:#b3261e;--r:12px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","DejaVu Sans",sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#2b2118;color:#f6ead8;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}.logo svg{flex:none}.logo small{display:block;font-weight:400;color:#cbb79c;font-size:12px}
.grow{flex:1}
.pill{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:#4a3a2c;color:#f6ead8;white-space:nowrap}.pill.ok{background:#e6f3ea;color:var(--ok)}.pill.err{background:#fbe5e3;color:var(--err)}.pill.busy{background:#fff3d6;color:#8a5a00}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;padding:14px;max-width:1700px;margin:0 auto}
.viewer{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:calc(100vh - 90px);position:sticky;top:70px;height:calc(100vh - 90px);overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);overflow-x:auto}.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}.tabs button.on{background:#f1e4d1;color:var(--acc)}
.tab{display:none;flex:1;min-height:0;position:relative}.tab.on{display:flex;flex-direction:column}
#cv3d{width:100%;flex:1;min-height:0;touch-action:none;cursor:grab;background:radial-gradient(ellipse at 50% 35%,#fffaf2,#efe3d2)}
.ov{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.ov label{display:flex;align-items:center;gap:6px}.ov input[type=range]{width:110px}
.dimbox{position:absolute;top:10px;left:10px;background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5}
.toolbar{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}.toolbar label{display:flex;gap:5px;align-items:center}
#svg2d{flex:1;min-height:0;overflow:hidden;touch-action:none;background:#efe7da;cursor:grab}#svg2d svg{width:100%;height:100%;display:block}
#svg2d .lbl{font-size:4.5px;fill:#8a7660;stroke:none;font-family:sans-serif}
.scroll{overflow:auto;padding:14px 16px;flex:1}
.panel{display:flex;flex-direction:column;gap:10px}
details{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}details>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}details>summary::after{content:"▾";color:var(--mut)}details[open]>summary::after{content:"▴"}
details .in{padding:2px 14px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mut)}.f input,.f select,.f textarea{font:inherit;color:var(--ink);padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.f textarea{min-height:64px;resize:vertical;font-size:14px}
.f.r{flex-direction:row;align-items:center;gap:8px}.f.r input[type=range]{flex:1;padding:0}.f.r output{min-width:46px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:6px}button.b{border:1px solid var(--line);background:#fff;padding:7px 11px;border-radius:8px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}button.b:hover{border-color:var(--acc2)}button.b.on{background:var(--acc);border-color:var(--acc);color:#fff}button.b.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.b:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{flex:1;border:0;background:#fff;padding:7px 6px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--mut);font-weight:600}.seg button.on{background:#f1e4d1;color:var(--acc)}
.card{background:#faf4ea;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55}.card b{font-variant-numeric:tabular-nums}
.sub{font-weight:700;margin:12px 0 6px;font-size:13px}.hint{font-size:12px;color:var(--mut);line-height:1.45;margin:6px 0}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pcard{border:1px solid var(--line);border-radius:9px;background:#fff;padding:4px 2px 5px;cursor:pointer;text-align:center;font-size:11px;line-height:1.15;color:var(--mut)}.pcard svg{width:100%;height:70px;display:block}.pcard.on{border-color:var(--acc);box-shadow:0 0 0 2px #f1d3b8;color:var(--acc);font-weight:700}
.list{display:flex;flex-direction:column;gap:6px;margin:6px 0}.li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;cursor:pointer;font-size:13px}.li.on{border-color:var(--acc);background:#fff7ee}.li .tag{font-size:11px;padding:2px 6px;border-radius:6px;background:#f1e4d1;color:var(--acc);white-space:nowrap}.li .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg{padding:8px 10px;border-radius:8px;margin:5px 0;font-size:13px;line-height:1.45}.msg.err{background:#fbe5e3;color:#7d1a14}.msg.warn{background:#fff3d6;color:#6b4800}.msg.ok{background:#e6f3ea;color:#1d5531}
.prog{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0}.prog i{display:block;height:100%;background:var(--acc2);width:0;transition:width .2s}
ol.steps{padding-left:20px;line-height:1.55}ol.steps li{margin:6px 0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:14px;height:3px;display:inline-block}
.drop{border:1.5px dashed var(--acc2);border-radius:10px;padding:12px;text-align:center;color:var(--mut);cursor:pointer;background:#fffaf3}
.empty{color:var(--mut);font-size:13px;padding:6px 0}
@media (max-width:980px){.layout{grid-template-columns:1fr;padding:8px;gap:8px}.viewer{position:relative;top:0;height:auto;min-height:0}#cv3d{height:52vh;min-height:300px;flex:none}#svg2d{height:55vh;flex:none}.scroll{max-height:70vh}.ov{position:static;margin:8px;border-radius:10px}.ov input[type=range]{width:90px}header{padding:8px 10px}.logo small{display:none}.pgrid{grid-template-columns:repeat(4,1fr)}.ov input[type=range]{width:80px}.dimbox{font-size:11px;padding:6px 8px}}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.ov{font-size:12px;gap:6px 10px}}

.cols{display:flex;flex-direction:column;gap:8px}.coll{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;cursor:pointer}.coll.on{border-color:var(--acc);box-shadow:0 0 0 2px #f1d3b8;background:#fff7ee}.coll b{font-size:14px}
.f input[type=checkbox]{width:auto;flex:none}.f.r{color:var(--ink)}

.f input.bad{border-color:var(--err);background:#fff4f3;box-shadow:0 0 0 2px #f6c9c5}.ferr{color:var(--err);font-size:11.5px;font-weight:600;line-height:1.3}

.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.fcard{border:1px solid var(--line);border-radius:10px;background:#fff;padding:5px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11.5px;cursor:pointer}.fcard img{width:100%;aspect-ratio:120/470;object-fit:contain;background:#efe5d6;border-radius:6px;min-height:120px}.fcard.on{border-color:var(--acc);box-shadow:0 0 0 2px #f1d3b8;background:#fff7ee}.fcard .b{padding:5px 8px;font-size:12px}
@media (max-width:420px){.fgrid{grid-template-columns:repeat(2,1fr)}}

.modal{position:fixed;inset:0;background:rgba(30,22,15,.6);display:none;z-index:50;align-items:center;justify-content:center;padding:12px}.modal.on{display:flex}
.mbox{background:var(--panel);border-radius:14px;max-width:min(980px,96vw);max-height:94vh;width:100%;display:flex;flex-direction:column;padding:12px;gap:6px}
.mhead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mbody{overflow:auto;flex:1;background:#e9dccb;border-radius:10px;padding:14px;text-align:center}
.pvwrap{display:inline-flex;flex-direction:column;align-items:center;gap:8px}.pvwrap img{display:block;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.ruler{font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start}.ruler span{display:block;width:50mm;height:6px;background:repeating-linear-gradient(90deg,#2b2118 0 1px,transparent 1px 5mm),#e9c46a;border:1px solid #2b2118}

.langsel{display:inline-flex;align-items:center;gap:4px;background:#4a3a2c;color:#f6ead8;border-radius:999px;padding:2px 4px 2px 8px;font-size:13px;flex:none}
.langsel select{background:transparent;color:#f6ead8;border:0;font:600 13px system-ui,sans-serif;padding:4px 2px;cursor:pointer;min-height:28px}
.langsel select option{color:#2b2118}
</style>
<style id="layout-swap">
/* Settings on the left, live 3D preview on the right (stays in view while scrolling) */
.layout{grid-template-columns:420px minmax(0,1fr)}
.layout>.panel{order:1}
.layout>.viewer{order:2}
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  header{position:static}
  .layout>.viewer{order:1;position:sticky;top:0;z-index:15;max-height:56vh;box-shadow:0 10px 24px -14px rgba(0,0,0,.45)}
  .layout>.panel{order:2}
  #cv3d{height:34vh;min-height:200px}
  #svg2d{height:34vh}
  .viewer .scroll{max-height:32vh}
}
</style>
<style id="cwm-only-zip">/* only the ZIP package is offered for download */[data-exp]:not([data-exp="all"]):not([data-exp="tall"]),details:has(> div > [data-exp="dxf"]),label:has(#psNoMark){display:none!important}</style>
</head>
<body>
<header>
  <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;background:#1f3b2d;color:#fff;font-weight:700;text-decoration:none;font-size:13px;white-space:nowrap" title="CNCWoodMakerDXF">← Site</a>
  <div class="logo"><svg width="30" height="30" viewBox="0 0 30 30"><path d="M9 28V12q0-3 3-6l1-4h4l1 4q3 3 3 6v16z" fill="#c8793b"/><path d="M11 14h8M11 18h8M11 22h8" stroke="#2b2118" stroke-width="1.4"/><ellipse cx="15" cy="9" rx="2.4" ry="1.2" fill="#2b2118"/></svg>
    <div>CNCWoodMakerDXF — Bottle Gift Box Generator<small>Подарочные коробки из фанеры для бутылок · DXF / SVG / AI 1:1, мм</small></div></div>

  <label class="langsel" data-notr title="Limbă / Language / Язык"><span aria-hidden="true">🌐</span><select id="uiLang" data-uilang aria-label="Limbă / Language / Язык"><option value="en">English</option><option value="ro">Română</option><option value="ru">Русский</option></select></label>
  <span id="status" class="pill busy">Проверка…</span>

</header>
<main class="layout">
  <section class="viewer">
    <nav class="tabs" id="tabs">
      <button data-tab="t3d" class="on">3D</button><button data-tab="t2d">2D детали</button><button data-tab="tchk">Проверка</button><button data-tab="tasm">Сборка</button><button data-tab="texp">Экспорт</button>
    </nav>

        <label>Верх: открыт <input type="range" id="vClosed" min="0" max="1" step="0.01" value="1"> закрыт</label>
        <label><input type="checkbox" id="vClip" checked> Фиксатор надет</label>
        <label>Разборка <input type="range" id="vExpl" min="0" max="1" step="0.01" value="0"></label>
        <label><input type="checkbox" id="vBottle" checked> Бутылка</label>
        <label><input type="checkbox" id="vIns" checked> Вставки</label>
        <button class="b" id="vAnim">▶ Анимация</button>
        <button class="b" id="vFront">Спереди</button><button class="b" id="vSide">Сбоку</button>
      </div>
    </div>
    <div class="tab" id="t2d">
      <div class="toolbar">
        <label><input type="checkbox" id="l_cut" checked> Резка</label>
        <label><input type="checkbox" id="l_flex" checked> Гибкие прорези</label>
        <label><input type="checkbox" id="l_eng" checked> Гравировка</label>
        <label><input type="checkbox" id="l_mark" checked> Монтажные метки</label>
        <label><input type="checkbox" id="l_br" checked> Перемычки букв</label>
        <div class="seg" style="min-width:210px"><button class="on" data-set="main">Детали коробки</button><button data-set="test">Тестовые детали</button></div>
        <button class="b" id="z_fit">⤢ Вписать</button>
        <div class="legend"><span><i style="background:#FF0000"></i>CUT_OUTER</span><span><i style="background:#0000FF"></i>CUT_INNER</span><span><i style="background:#FF00FF"></i>FLEX_CUT</span><span><i style="background:#00A000"></i>ENGRAVE</span><span><i style="background:#888"></i>MARK</span><span><i style="background:#ff9800;height:8px"></i>перемычки</span></div>
      </div>
      <div id="svg2d"></div>
    </div>
    <div class="tab" id="tchk"><div class="scroll"><div class="prog"><i id="progbar"></i></div><div id="chkList"></div></div></div>
    <div class="tab" id="tasm"><div class="scroll" id="asm"></div></div>
    <div class="tab" id="texp"><div class="scroll" id="exp"></div></div>
  </section>
  <aside class="panel" id="panel"></aside>
</main>
<script>/* ===================== i18n: общий словарь (ключ — русский исходный текст) =====================
   Чтобы добавить язык: добавьте его в I18N_LANGS и поле с этим кодом в записи словаря. */
const I18N_LANGS = [{ code: 'ro', short: 'RO', name: 'Română' }, { code: 'en', short: 'EN', name: 'English' }, { code: 'ru', short: 'RU', name: 'Русский', source: true }];

"Gravură (umplere)"},"Ширина":{"en":"Width","ro":"Lățime"},"Смещение X, мм":{"en":"Offset X, mm","ro":"Deplasare X, mm"},"Смещение Y, мм":{"en":"Offset Y, mm","ro":"Deplasare Y, mm"},"Порог":{"en":"Threshold","ro":"Prag"},"Удалять точки меньше, мм²":{"en":"Remove dots smaller than, mm²","ro":"Elimină punctele mai mici de, mm²"},"Инверсия":{"en":"Invert","ro":"Inversare"},"Центрировать":{"en":"Centre","ro":"Centrează"},"Подогнать по области":{"en":"Fit to area","ro":"Potrivește în zonă"},"Полутона: в SVG изображение встраивается в слой ENGRAVE; для DXF скачивается ZIP с PNG и инструкцией размещения.":{"en":"Halftone: in SVG the image is embedded in the ENGRAVE layer; for DXF a ZIP with the PNG and placement instructions is downloaded.","ro":"Semitonuri: în SVG imaginea e inclusă în stratul ENGRAVE; pentru DXF se descarcă un ZIP cu PNG și instrucțiuni de plasare."},"Экспорт пробника заблокирован.":{"en":"Test piece export blocked.","ro":"Exportul piesei de test e blocat."},"Экспорт заблокирован: параметры изменены, идёт проверка…":{"en":"Export blocked: parameters changed, checking…","ro":"Export blocat: parametrii s-au schimbat, se verifică…"},"Проверка…":{"en":"Checking…","ro":"Se verifică…"},"Ошибка построения":{"en":"Build error","ro":"Eroare de construire"},"Идёт проверка геометрии…":{"en":"Checking geometry…","ro":"Se verifică geometria…"},"Проверка":{"en":"Checks","ro":"Verificare"},"ошибк(и) — экспорт только пробника заблокирован (см. «Проверка»).":{"en":"error(s) — only the test piece export is blocked (see “Checks”).","ro":"eroare(i) — doar exportul piesei de test e blocat (vezi „Verificare”)."},"✕ Ошибок":{"en":"✕ Errors","ro":"✕ Erori"},"Экспорт коробки заблокирован: исправьте ошибки":{"en":"Box export blocked: fix the errors","ro":"Exportul cutiei e blocat: corectează erorile"},"см. вкладку «Проверка».":{"en":"see the “Checks” tab.","ro":"vezi fila „Verificare”."},"✓ Коробка готова · пробник заблокирован":{"en":"✓ Box ready · test piece blocked","ro":"✓ Cutia e gata · piesa de test blocată"},"✓ Готово · предупреждений":{"en":"✓ Ready · warnings","ro":"✓ Gata · avertismente"},"✓ Готово к экспорту":{"en":"✓ Ready to export","ro":"✓ Gata de export"},"Проверка пройдена с предупреждениями — просмотрите их перед резкой.":{"en":"Checks passed with warnings — review them before cutting.","ro":"Verificarea a trecut cu avertismente — revezi-le înainte de tăiere."},"Проверка пройдена.":{"en":"Checks passed.","ro":"Verificarea a trecut."},"Внутри":{"en":"Inside","ro":"Interior"},"мм, высота корпуса над подкладкой":{"en":"mm, body height above the pad","ro":"mm, înălțimea corpului deasupra căptușelii"},"Корпус снаружи":{"en":"Body outside","ro":"Corp exterior"},"Полная высота с ручкой":{"en":"Total height with handle","ro":"Înălțime totală cu mâner"},"Развёртка передней стенки":{"en":"Front wall flat layout","ro":"Desfășurarea peretelui din față"},"Бутылка до сгиба: мин. зазор":{"en":"Bottle to bend: min. clearance","ro":"Sticla până la îndoire: joc minim"},"мм · до фиксатора":{"en":"mm · to the clip","ro":"mm · până la clemă"},"нужно поле ≥":{"en":"work area needed ≥","ro":"câmp necesar ≥"},"Экспорт заблокирован. Выберите большее рабочее поле — масштаб 1:1 сохраняется.":{"en":"Export blocked. Choose a larger work area — the 1:1 scale is kept.","ro":"Export blocat. Alege un câmp de lucru mai mare — scara 1:1 se păstrează."},"Все детали помещаются в поле":{"en":"All parts fit the work area","ro":"Toate piesele încap în câmpul"},"мм · высота":{"en":"mm · height","ro":"mm · înălțime"},"рядов, длина":{"en":"rows, length","ro":"rânduri, lungime"},"мм, две дуги по":{"en":"mm, two arcs of","ro":"mm, două arce de"},"радиус ≈":{"en":"radius ≈","ro":"rază ≈"},"мм, центр на":{"en":"mm, centre at","ro":"mm, centrul la"},"мм развёртки. Вырез под фиксатор":{"en":"mm of the flat layout. Clip notch","ro":"mm din desfășurare. Decupaj pentru clemă"},"✕ [пробник]":{"en":"✕ [test piece]","ro":"✕ [piesa de test]"},"Проверяются: посадка бутылки, зазор до сгиба и фиксатора, замкнутость контуров, дубли линий, пересечения вырезов, выпадающие фрагменты, ширина перемычек (≥":{"en":"Checked: bottle fit, clearance to the bend and the clip, closed outlines, duplicate lines, cut intersections, loose fragments, bridge width (≥","ro":"Se verifică: potrivirea sticlei, jocul până la îndoire și clemă, contururi închise, linii duplicate, intersecții de tăieturi, fragmente care cad, lățimea punților (≥"},"мм), совпадение шип–паз. Прочность готовой коробки проверяется только на физическом образце.":{"en":"mm), tab–slot match. The strength of the finished box can only be checked on a physical sample.","ro":"mm), potrivirea cep–fantă. Rezistența cutiei finite se verifică doar pe o mostră fizică."},"Схема сборки":{"en":"Assembly diagram","ro":"Schema de asamblare"},"Тестовые детали.":{"en":"Test parts.","ro":"Piese de test."},"Сначала вырежьте их (вкладка «Экспорт» → «Тестовые детали»): полосу гибкости, пару шип/паз, вершины ручки с фиксатором и пластину с вырезанной надписью. Если шип входит слишком туго или свободно — измените «Посадку шип–паз» или kerf и повторите.":{"en":"Cut them first (“Export” tab → “Test parts”): the flex strip, a tab/slot pair, the handle tops with the clip and the plate with cut-out text. If the tab is too tight or too loose — change the “Tab–slot fit” or kerf and repeat.","ro":"Taie-le mai întâi (fila „Export” → „Piese de test”): banda de flexibilitate, perechea cep/fantă, vârfurile mânerului cu clema și placa cu text decupat. Dacă cepul intră prea strâns sau prea liber — schimbă „Jocul cep–fantă” sau kerf-ul și repetă."},"Порядок операций на станке":{"en":"Machine operation order","ro":"Ordinea operațiunilor pe mașină"},"1) ENGRAVE — гравировка; 2) CUT_INNER — внутренние вырезы, отверстия ручки, ажур и вырезанный текст; 3) FLEX_CUT — прорези для сгиба; 4) CUT_OUTER — внешние контуры. Слой MARK не режется (только для ориентации).":{"en":"1) ENGRAVE — engraving; 2) CUT_INNER — inner cut-outs, handle holes, openwork and cut-out text; 3) FLEX_CUT — bend slits; 4) CUT_OUTER — outer outlines. The MARK layer is not cut (orientation only).","ro":"1) ENGRAVE — gravură; 2) CUT_INNER — decupaje interioare, găurile mânerului, ajur și text decupat; 3) FLEX_CUT — fante de îndoire; 4) CUT_OUTER — contururi exterioare. Stratul MARK nu se taie (doar pentru orientare)."},"Вставьте шипы дна ① в нижние пазы боковин ② и ③ (дно поднято на":{"en":"Insert the bottom tabs ① into the lower slots of side walls ② and ③ (the bottom is raised","ro":"Introdu cepurile fundului ① în fantele de jos ale pereților laterali ② și ③ (fundul e ridicat cu"},"мм от стола).":{"en":"mm off the table).","ro":"mm de la masă)."},"Наденьте переднюю ④ и заднюю ⑤ стенки: вертикальные шипы боковин входят в ряды пазов, шипы дна — в нижние пазы. Для прочности приклейте шипы столярным клеем; гибкую зону клеем не заливайте.":{"en":"Fit the front ④ and back ⑤ walls: the vertical tabs of the side walls go into the rows of slots, the bottom tabs into the lower slots. For strength, glue the tabs with wood glue; do not fill the flex zone with glue.","ro":"Montează pereții din față ④ și spate ⑤: cepurile verticale ale pereților laterali intră în rândurile de fante, cepurile fundului — în fantele de jos. Pentru rezistență, lipește cepurile cu adeziv pentru lemn; nu umple zona flexibilă cu adeziv."},"Вставка на дно: склейте":{"en":"Bottom insert: glue","ro":"Inserție de fund: lipește"},"основание ⑦ и":{"en":"base ⑦ and","ro":"baza ⑦ și"},"сл. кольца ⑧ (отверстия по углам совмещаются) и положите вставку на подкладку. Она съёмная — вынимается за угловые отверстия.":{"en":"ring layers ⑧ (the corner holes line up) and place the insert on the pad. It is removable — lift it out by the corner holes.","ro":"straturi de inel ⑧ (găurile din colțuri se aliniază) și pune inserția pe căptușeală. E detașabilă — se scoate de găurile din colțuri."},"Положите подкладку":{"en":"Place the pad","ro":"Pune căptușeala"},"мм) на дно. Пока верхние части раскрыты, опустите бутылку сверху: проём":{"en":"mm) on the bottom. While the top parts are open, lower the bottle from above: opening","ro":"mm) pe fund. Cât timp părțile de sus sunt deschise, coboară sticla de sus: deschiderea"},"Контрастная вставка ⑨: опустите пластину вдоль стенки":{"en":"Contrast insert ⑨: lower the plate along the wall","ro":"Inserția de contrast ⑨: coboară placa de-a lungul peretelui"},"за вырезанным именем":{"en":"behind the cut-out name","ro":"în spatele numelui decupat"},"окно пластины совпадает с окном для этикетки)":{"en":"the plate window lines up with the label window)","ro":"fereastra plăcii coincide cu fereastra etichetei)"},"затем бутылку — бутылка прижмёт пластину. Без пластины через буквы видна бутылка.":{"en":"then the bottle — the bottle will press the plate. Without the plate, the bottle shows through the letters.","ro":"apoi sticla — sticla va presa placa. Fără placă, prin litere se vede sticla."},"Плавно сведите гибкие верхушки над горлышком, пока отверстия ручки не совпадут. Не перегибайте фанеру резко.":{"en":"Gently bring the flexible tops together above the neck until the handle holes line up. Do not bend the plywood sharply.","ro":"Apropie ușor vârfurile flexibile deasupra gâtului până când găurile mânerului coincid. Nu îndoi placajul brusc."},"Наденьте фиксатор-скобу ⑥ сверху в вырез на вершинах обеих стенок до упора — ножки скобы прижмут верхушки друг к другу. Чтобы открыть коробку, потяните скобу вверх.":{"en":"Push the locking clip ⑥ from above into the notch at the tops of both walls all the way — the clip legs will press the tops together. To open the box, pull the clip up.","ro":"Pune clema ⑥ de sus în decupajul din vârful ambilor pereți până la capăt — picioarele clemei vor strânge vârfurile. Pentru a deschide cutia, trage clema în sus."},"Проверка прочности.":{"en":"Strength check.","ro":"Verificarea rezistenței."},"Прочность готовой коробки зависит от конкретной фанеры, клея и качества реза — её нужно проверить на физическом образце: вложите груз не легче полной бутылки (вино 0,75 л ≈ 1,2–1,6 кг, шампанское ≈ 1,6–1,9 кг; лучше с запасом ×2), поднимите за ручку, подержите 1–2 минуты и слегка покачайте. Осмотрите гибкую зону, перемычки вокруг ручки и шипы. Только после этого используйте коробку с настоящей бутылкой.":{"en":"The strength of the finished box depends on the specific plywood, glue and cut quality — it must be checked on a physical sample: put in a load no lighter than a full bottle (wine 0.75 l ≈ 1.2–1.6 kg, champagne ≈ 1.6–1.9 kg; better with a ×2 margin), lift it by the handle, hold for 1–2 minutes and shake gently. Inspect the flex zone, the bridges around the handle and the tabs. Only then use the box with a real bottle.","ro":"Rezistența cutiei finite depinde de placajul, adezivul și calitatea tăieturii — trebuie verificată pe o mostră fizică: pune o greutate cel puțin cât o sticlă plină (vin 0,75 l ≈ 1,2–1,6 kg, șampanie ≈ 1,6–1,9 kg; mai bine cu rezervă ×2), ridic-o de mâner, ține-o 1–2 minute și scutur-o ușor. Verifică zona flexibilă, punțile din jurul mânerului și cepurile. Abia apoi folosește cutia cu o sticlă adevărată."},"Посмотреть, как совмещаются ручки, закрывается фиксатор и открывается верх, можно во вкладке 3D (кнопка «▶ Анимация»).":{"en":"You can see how the handles line up, the clip closes and the top opens in the 3D tab (“▶ Animation” button).","ro":"Cum se aliniază mânerele, se închide clema și se deschide vârful vezi în fila 3D (butonul „▶ Animație”)."},"Детали коробки — полный пакет":{"en":"Box parts — full package","ro":"Piesele cutiei — pachet complet"},"⬇ Скачать ZIP: DXF + SVG + AI + README + LICENSE":{"en":"⬇ Download ZIP: DXF + SVG + AI + README + LICENSE","ro":"⬇ Descarcă ZIP: DXF + SVG + AI + README + LICENSE"},"ZIP без слоя MARK":{"en":"ZIP without MARK layer","ro":"ZIP fără stratul MARK"},"ZIP по листам (Sheet_01.dxf/.svg/.ai…)":{"en":"ZIP by sheet (Sheet_01.dxf/.svg/.ai…)","ro":"ZIP pe foi (Sheet_01.dxf/.svg/.ai…)"},"От   document.addEventListener('input', e => { const el = e.target.closest('[data-pk]'); if (!el) return; S.pack[el.dataset.pk] = el.type === 'checkbox' ? el.checked : el.value; try { localStorage.setItem('cncwm_pack', JSON.stringify(S.pack)); } catch (er) {} pkSync(); });
  window.pkSync = pkSync; pkSync();
  $$('#tabs button').forEach(b => b.onclick = () => { $$('#tabs button').forEach(x => x.classList.toggle('on', x === b)); $$('.tab').forEach(t => t.classList.toggle('on', t.id === b.dataset.tab)); if (b.dataset.tab === 't3d' && view) view.dirty = true; if (b.dataset.tab === 't2d') applyVB(); });
  $('#btnSave').onclick = saveProject; $('#fileProj').onchange = e => { const f = e.target.files[0]; if (f) openProject(f); e.target.value = ''; };
  bind2D(); bind3D(); syncPanel(); changed();
  const ls = $('#uiLang'); ls.value = UI_LANG; ls.onchange = () => setUILang(ls.value); document.documentElement.lang = UI_LANG; i18nStart();
}
function onUILangChanged() { if (typeof scheduleThumbs === 'function') scheduleThumbs(); }
window.addEventListener('DOMContentLoaded', init);
